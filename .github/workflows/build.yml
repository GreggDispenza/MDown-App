name: Build installables

# Produces the end-user deliverables as workflow artifacts:
#   - mdown-windows            (zipped portable Windows app, run mdown_app.exe)
#   - mdown-windows-installer  (MDown-Setup.exe: installs + shortcuts + uninstaller)
#   - mdown-android            (APK, for sideloading / QA)
#   - mdown-android-aab        (AAB, the Google Play upload artifact; release-
#                               signed when the ANDROID_* secrets are set)
# Runs automatically on every code push (docs-only pushes are skipped),
# on demand, and on version tags.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"

# Least privilege: these jobs only read the repo and upload artifacts
# (artifacts use a separate scope, not GITHUB_TOKEN contents).
permissions:
  contents: read

# A newer push supersedes any still-running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLET_VERSION: "0.28.3"
  FLUTTER_VERSION: "3.27.4"
  # flet's CLI prints unicode spinner glyphs; Windows runners default to
  # cp1252 and crash on them without these.
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows (.exe)
    # Pinned to windows-2022, NOT windows-latest: the latest image now
    # ships Visual Studio 2026, which Flet 0.28.3's bundled Flutter 3.29.2
    # and its CMake can't target (CMake falls back to the "Visual Studio
    # 16 2019" generator and finds no matching VS). windows-2022 has the
    # VS 2022 toolchain Flutter 3.29.2 is built for.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Windows app
        shell: bash
        # flet wraps the build in a rich "Live" spinner that floods the log
        # with a repeated banner and hides the real error. TERM=dumb /
        # NO_COLOR stop the animation; on failure we also print the error
        # tail with the two flood lines filtered out, so the true CMake /
        # compiler message is visible.
        env:
          TERM: dumb
          NO_COLOR: "1"
        run: |
          set -o pipefail
          flet build windows --verbose 2>&1 | tee build.log || {
            echo "==================== real error tail ===================="
            grep -avF 'Error building Flet app - see the log of failed command above.' build.log \
              | grep -avF 'Running Flutter doctor' | tail -n 100
            exit 1
          }
      - name: Stage app into a single MDown/ folder
        shell: bash
        # flet drops the runnable bundle (mdown.exe + DLLs + data/) loose in
        # build/windows. Zipping that directly gives the user a pile of files
        # with the .exe hidden among the DLLs. Instead: print the real tree,
        # fail loudly if no .exe is present, and repackage everything under a
        # single MDown/ folder so the unzipped result is obviously an app
        # folder you open and run.
        # NOTE: GitHub runs this with `bash -eo pipefail`, so piping a huge
        # listing into `head` makes the upstream command die with SIGPIPE
        # (exit 141) and fails the step. We therefore redirect long output to
        # files and never pipe into `head`.
        run: |
          echo "==================== build/windows top level ===================="
          ls -la build/windows
          echo "==================== .exe files under build/windows ===================="
          find build/windows -iname '*.exe' > exes.txt 2>/dev/null || true
          cat exes.txt
          if [ ! -s exes.txt ]; then
            echo "ERROR: no .exe produced by 'flet build windows'"
            echo "-------------------- full tree (first 300 entries) --------------------"
            find build/windows > fulltree.txt 2>/dev/null || true
            sed -n '1,300p' fulltree.txt
            exit 1
          fi
          mkdir -p staging/MDown
          cp -r build/windows/. staging/MDown/
          exename="$(basename "$(head -n 1 exes.txt)")"
          printf 'To run MDown:\r\n\r\n1. Keep every file in this folder together.\r\n2. Double-click %s (Windows may show it as just "%s" with an app icon).\r\n\r\nWindows SmartScreen may warn because the app is unsigned:\r\nclick "More info" then "Run anyway".\r\n' "$exename" "${exename%.exe}" > "staging/MDown/HOW-TO-RUN.txt"
          echo "==================== staged MDown/ top level ===================="
          ls -la staging/MDown
      - name: Zip app folder
        run: Compress-Archive -Path staging/MDown -DestinationPath mdown-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mdown-windows
          path: mdown-windows.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        # Wrap the staged MDown/ folder into a single MDown-Setup.exe.
        # Inno Setup 6 is preinstalled on GitHub windows runners; fall back
        # to choco if the image ever drops it. AppSrc is passed as an
        # absolute path so ISCC resolves [Files] Source correctly.
        run: |
          $iscc = Get-ChildItem -Path `
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe", `
            "C:\Program Files\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Host "Inno Setup not found; installing via choco..."
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using ISCC: $iscc"
          $src = (Resolve-Path "staging/MDown").Path
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          & "$iscc" "/DAppSrc=$src" "/O$((Resolve-Path 'installer').Path)" "packaging\windows\mdown.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer
          if (-not (Test-Path "installer/MDown-Setup.exe")) { throw "MDown-Setup.exe was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: mdown-windows-installer
          path: installer/MDown-Setup.exe

  android:
    name: Android (.apk + .aab)
    runs-on: ubuntu-latest # Android SDK/NDK preinstalled on this image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@9a48871cbeff8679f6337339dc79b806ad9a9a13 # v2.9.1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: pip install flet==${{ env.FLET_VERSION }}

      - name: Read app version
        id: ver
        # versionName comes from pyproject; versionCode is derived from the CI
        # run number + attempt so every Play upload has a unique, increasing
        # code (Actions expressions have no arithmetic, so compute it in shell).
        run: |
          v="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          bn=$(( GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build_number=$bn" >> "$GITHUB_OUTPUT"
          echo "App version $v, build number $bn"

      - name: Prepare Android signing (real key, else ephemeral proof key)
        id: signing
        # The real release keystore lives only in CI secrets. When it is absent
        # we still sign — with a throwaway keystore generated here — so the
        # release signing PATH (flet's --android-signing-* flags) is exercised
        # and verified on every build, instead of shipping an untested pipeline.
        # Two distinct outputs keep this safe:
        #   available = a REAL upload key is present (gates the Play upload)
        #   signed    = signing will happen at all (real OR ephemeral)
        # so an ephemeral-signed AAB can never be uploaded to Play. Populate the
        # four ANDROID_* secrets to sign with the real key. See docs/BUILDING.md.
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          ks="$RUNNER_TEMP/upload-keystore.jks"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$ks"
            chmod 600 "$ks"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "signed=true"    >> "$GITHUB_OUTPUT"
            echo "mode=release"    >> "$GITHUB_OUTPUT"
            echo "Release signing keystore decoded."
          else
            # Proof-only key: fixed throwaway passwords, short validity. Never
            # leaves the runner and can't reach Play (see `available` above).
            keytool -genkeypair -v -keystore "$ks" \
              -alias ephemeral -keyalg RSA -keysize 2048 -validity 30 \
              -storepass android -keypass android \
              -dname "CN=MDown CI Ephemeral, OU=CI, O=MDown, C=US"
            chmod 600 "$ks"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "signed=true"     >> "$GITHUB_OUTPUT"
            echo "mode=ephemeral"  >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_B64 secret set — signing with an EPHEMERAL proof key (verifies the signing path but is NOT uploadable to Google Play). Add the ANDROID_* signing secrets to sign a real release bundle."
          fi

      - name: Build APK (sideload) and AAB (Play), with pure-Python fallback
        # Path A: default `flet build` — works if Flet's wheel index carries
        # the native deps (onnxruntime et al.) for Android.
        # Path B: scripts/build_android.py — pure-Python dependency set with
        # the local magika stand-in. See docs/BUILDING.md.
        # Signing/version flags are shared across both targets. The build is
        # always signed (real key when the secrets are set, else the ephemeral
        # proof key from the previous step).
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_SIGNED: ${{ steps.signing.outputs.signed }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          # versionCode (run_number*100+run_attempt) is computed in the version
          # step so a re-run still yields a unique, increasing code — run_number
          # alone is not re-run-safe.
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
          BUILD_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -o pipefail
          # --project pins the Android applicationId to app.mdown.mdown
          # (org "app.mdown" from [tool.flet] + project "mdown"). Without it flet
          # derives the name from [project].name ("mdown-app" -> "mdown_app"),
          # ignoring [tool.flet] project, which would ship app.mdown.mdown_app and
          # mismatch the Play packageName below. This is the PERMANENT app id.
          common=(--verbose
                  --project mdown
                  --build-number "$BUILD_NUMBER"
                  --build-version "$BUILD_VERSION"
                  --android-adaptive-icon-background "#4F46E5")
          sign=()
          if [ "$SIGNING_SIGNED" = "true" ]; then
            if [ "$SIGNING_MODE" = "ephemeral" ]; then
              # Match the throwaway keystore created in the signing step.
              KEYSTORE_PASSWORD=android; KEY_PASSWORD=android; KEY_ALIAS=ephemeral
            fi
            sign=(--android-signing-key-store "$KEYSTORE_PATH"
                  --android-signing-key-store-password "$KEYSTORE_PASSWORD"
                  --android-signing-key-password "$KEY_PASSWORD"
                  --android-signing-key-alias "$KEY_ALIAS")
          fi
          build() {  # $1 = apk|aab — Path A (full deps) then Path B (pure-Python)
            flet build "$1" "${common[@]}" "${sign[@]}" \
              || python scripts/build_android.py "$1" "${common[@]}" "${sign[@]}"
          }
          build aab || { echo "::error::AAB build failed (both full-deps and pure-Python paths)"; exit 1; }
          build apk || { echo "::error::APK build failed (both full-deps and pure-Python paths)"; exit 1; }

      - name: Inspect generated AndroidManifest (permissions audit)
        # Surface the manifest in the log so any dangerous storage permission
        # (e.g. MANAGE_EXTERNAL_STORAGE) that would trigger Play policy review
        # is visible on every build. Best-effort: never fails the job.
        if: always()
        run: |
          # Path A writes under ./build; Path B (build_android.py) builds in a
          # mdown-android-* temp dir. Search both, best-effort.
          roots="build"
          for d in "${RUNNER_TEMP:-/tmp}"/mdown-android-* /tmp/mdown-android-*; do
            [ -d "$d" ] && roots="$roots $d"
          done
          found=""
          for m in $(find $roots -name AndroidManifest.xml -path '*main*' 2>/dev/null); do
            found=1
            echo "== $m =="
            grep -iE 'uses-permission|<application' "$m" || true
          done
          [ -n "$found" ] || echo "AndroidManifest.xml not found (build may have failed earlier)"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find build/aab build/apk dist/android \( -name '*.aab' -o -name '*.apk' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -l out/
          test -n "$(ls out/*.aab 2>/dev/null)" # AAB is the Play deliverable

      - name: Verify release signing (proves the signing path end-to-end)
        # The build is always signed (real key or the ephemeral proof key), so
        # assert it: apksigner must confirm a valid signature. This is a HARD
        # gate — it fails the build if the --android-signing-* flags ever
        # silently stop taking effect, so a real release can never regress to
        # unsigned unnoticed.
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          apk="$(ls out/*.apk 2>/dev/null | head -1)"
          [ -n "$apk" ] || { echo "::error::no APK produced to verify"; exit 1; }
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          as="$(find "$sdk/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$as" ] || { echo "::error::apksigner not found under the Android SDK"; exit 1; }
          echo "Verifying $apk (mode=${SIGNING_MODE:-unknown}) with $as"
          "$as" verify --verbose --print-certs "$apk"
          echo "APK signature verified — the release signing path works."

      - name: Inspect built APK (activity, target SDK, permissions)
        # Recon: surface the ground-truth Android facts later verification steps
        # depend on — the launchable activity, target/min SDK, and the real
        # permission set — from the built APK via aapt/aapt2. Written to a small
        # file (uploaded below) so the facts survive log truncation. Best-effort:
        # never fails the build; the aapt tool is located under the SDK (newest
        # build-tools) rather than hard-coded to a version.
        if: always()
        run: |
          f=out/apk-facts.txt; mkdir -p out; : > "$f"
          apk="$(ls out/*.apk 2>/dev/null | head -1)"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt2="$(find "$sdk/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1)"
          aapt="$(find "$sdk/build-tools" -name aapt 2>/dev/null | sort -V | tail -1)"
          { echo "apk=$apk"; echo "aapt2=$aapt2"; echo "aapt=$aapt"; } >> "$f"
          if [ -n "$apk" ]; then
            badging=""
            for t in "$aapt2" "$aapt"; do
              [ -n "$t" ] || continue
              badging="$("$t" dump badging "$apk" 2>/dev/null)" && [ -n "$badging" ] && break || true
            done
            echo "$badging" \
              | grep -iE "^package:|application-label:|launchable-activity:|(target)?[sS]dkVersion|uses-permission" \
              >> "$f" || echo "(no badging output)" >> "$f"
          else
            echo "(no APK found)" >> "$f"
          fi
          echo "=== apk-facts.txt ==="; cat "$f"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdown-apk-facts
          path: out/apk-facts.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mdown-android-aab
          path: out/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: mdown-android
          path: out/*.apk

      - name: Decide Play upload
        id: play
        # Only publish from a version tag, and only when the build was signed
        # and a Play service-account secret exists. Computed in a run step so
        # the secret is read as an env var (not in a step-level `if`).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          TAG: ${{ github.ref_name }}
        run: |
          # Require a strict semver tag (vX.Y.Z) as a backstop — the `v*` push
          # filter would also match ad-hoc tags like `v-test` or `vendor`.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$PLAY_SA" ] && [ "$SIGNING_AVAILABLE" = "true" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Play upload skipped — needs a vX.Y.Z tag, a signed build (ANDROID_* secrets), and PLAY_SERVICE_ACCOUNT_JSON."
          fi

      - name: Upload AAB to Google Play (internal track)
        if: steps.play.outputs.upload == 'true'
        # Pinned to a full commit SHA (this step receives the Play service
        # account). Update the SHA and the trailing version together.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.mdown.mdown # verify == generated applicationId
          releaseFiles: out/*.aab
          track: internal
          status: completed

      - name: Clean up signing keystore
        # Always remove the decoded keystore, even on failure. Harmless on
        # GitHub-hosted runners (the VM is discarded) but essential if this
        # ever runs on a self-hosted runner, where RUNNER_TEMP can persist.
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/upload-keystore.jks" 2>/dev/null \
            || rm -f "$RUNNER_TEMP/upload-keystore.jks" || true

  android-smoke:
    name: Android on-device smoke (emulator)
    # Proves the biggest unknown: the app launches and its Python runtime starts
    # on Android. Reuses the APK the android job built. The result is carried by
    # this job's pass/fail conclusion (readable via the API), because the
    # emulator's logcat/screenshots are artifacts the environment can't fetch.
    needs: android
    runs-on: ubuntu-latest
    # Backstop: the emulator + probe should finish well under this. Without it a
    # stalled adb call would otherwise burn GitHub's 360-minute default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: mdown-android
          path: apk
      - name: Enable KVM (emulator hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and probe app liveness
        # Pinned to a full SHA. api-level 35 matches the app's targetSdk 35.
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/android_smoke.sh
