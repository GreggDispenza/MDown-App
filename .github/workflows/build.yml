name: Build installables

# Produces the two end-user deliverables as workflow artifacts:
#   - mdown-windows  (zipped self-contained Windows app with mdown.exe)
#   - mdown-android  (APK)
# Runs automatically on every code push (docs-only pushes are skipped),
# on demand, and on version tags.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"

# Least privilege: these jobs only read the repo and upload artifacts
# (artifacts use a separate scope, not GITHUB_TOKEN contents).
permissions:
  contents: read

# A newer push supersedes any still-running build of the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLET_VERSION: "0.28.3"
  FLUTTER_VERSION: "3.27.4"
  # flet's CLI prints unicode spinner glyphs; Windows runners default to
  # cp1252 and crash on them without these.
  PYTHONIOENCODING: "utf-8"
  PYTHONUTF8: "1"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build Windows app
        shell: bash
        # flet wraps the build in a rich "Live" spinner that floods the log
        # with a repeated banner and hides the real error. TERM=dumb /
        # NO_COLOR stop the animation; on failure we also print the error
        # tail with the two flood lines filtered out, so the true CMake /
        # compiler message is visible.
        env:
          TERM: dumb
          NO_COLOR: "1"
        run: |
          set -o pipefail
          flet build windows --verbose 2>&1 | tee build.log || {
            echo "==================== real error tail ===================="
            grep -avF 'Error building Flet app - see the log of failed command above.' build.log \
              | grep -avF 'Running Flutter doctor' | tail -n 100
            exit 1
          }
      - name: Zip app folder
        run: Compress-Archive -Path build/windows/* -DestinationPath mdown-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mdown-windows
          path: mdown-windows.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest # Android SDK/NDK preinstalled on this image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: pip install flet==${{ env.FLET_VERSION }}
      - name: Build APK (full deps, then pure-Python fallback)
        # Path A: default build — works if Flet's wheel index carries the
        # native deps (onnxruntime et al.) for Android.
        # Path B: scripts/build_android.py — pure-Python dependency set
        # with the local magika stand-in. See docs/BUILDING.md.
        run: |
          flet build apk --verbose || python scripts/build_android.py --verbose
      - name: Collect APK
        run: |
          mkdir -p out
          find build/apk dist/android -name '*.apk' -exec cp {} out/ \; 2>/dev/null || true
          ls -l out/
          test -n "$(ls out/*.apk 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        with:
          name: mdown-android
          path: out/*.apk
